<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Treasure Hunt | Analytics</title>

    <link rel="stylesheet" href="css/analysis.css" />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Dashboard logic -->
    <script type="module" src="js/analysis/charts.js"></script>
  </head>

  <body>
    <header class="dashboard-header">
      <div>
        <h1>Treasure Hunt Analytics</h1>
        <p>User Interaction & Behavior Analysis</p>
      </div>
    </header>

    <main class="dashboard">
      <!-- File upload -->
      <section class="upload-section">
        <h2>Upload Results</h2>
        <p>Select one or multiple Treasure Hunt JSON files.</p>

        <input
          type="file"
          id="json-upload"
          accept=".json,application/json"
          multiple
        />
        <p id="upload-status"></p>
      </section>

      <!-- Dashboard, hidden until files are loaded -->
      <div id="dashboard-content" hidden>
        <section class="overview">
          <h2>Session Overview</h2>
          <div id="summary-cards" class="cards"></div>
        </section>

        <section class="analytics">
          <h2>Interaction Analysis</h2>

          <div class="chart-grid">
            <article class="chart-card">
              <h3>Interaction Types</h3>
              <canvas id="interaction-chart"></canvas>
            </article>

            <article class="chart-card">
              <h3>Feature Usage</h3>
              <canvas id="feature-chart"></canvas>
            </article>

            <article class="chart-card">
              <h3>Interaction Timeline</h3>
              <canvas id="timeline-chart"></canvas>
            </article>
          </div>
        </section>

        <section class="patterns">
          <h2>Behavior Patterns</h2>
          <div id="behavior-patterns"></div>
        </section>
      </div>
    </main>
  </body>
</html>
